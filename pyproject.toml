[project]
name = "discovery-engine"
version = "0.2.0"
description = "SIGNAL Discovery Engine — 22-point site discovery and analysis for any URL"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Optiminastic"},
]
keywords = ["seo", "discovery", "structured-data", "eeat", "ai-visibility", "schema-org"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]",
    "httpx",
    "beautifulsoup4",
    "lxml",
    "jinja2",
    "pydantic>=2.0",
    "pydantic-settings",
    "structlog",
    "textstat",
    "xhtml2pdf",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]


[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app"]
exclude = ["reports"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
